
name: Build Pulse Dialer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate or Extract Android Project
        run: |
          set -e

          if [ -f settings.gradle.kts ]; then
            PROJECT_DIR="$PWD"
          else
            ZIP_FILE="$(find . -maxdepth 1 -name '*.zip' | head -n 1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "Android project ZIP not found!"
              exit 1
            fi

            mkdir -p _project
            unzip -q -o "$ZIP_FILE" -d _project

            FOUND="$(find _project -maxdepth 4 -name settings.gradle.kts | head -n 1)"

            if [ -z "$FOUND" ]; then
              echo "settings.gradle.kts not found!"
              exit 1
            fi

            PROJECT_DIR="$(cd "$(dirname "$FOUND")" && pwd)"
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseDialer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
