name: Build Pulse Dialer APK

# Works in two layouts:
#   1. The project files (settings.gradle.kts, app/, ...) are at the repository root.
#   2. Only the project ZIP was uploaded to the repository root: it is extracted automatically.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate (or extract) the Android project
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            PROJECT_DIR="$PWD"
          else
            ZIP_FILE="$(ls -1 *.zip 2>/dev/null | head -n 1 || true)"
            if [ -z "$ZIP_FILE" ]; then
              echo "No settings.gradle.kts and no .zip file found in the repository root."; exit 1
            fi
            echo "Extracting $ZIP_FILE"
            mkdir -p _project
            unzip -q -o "$ZIP_FILE" -d _project
            FOUND="$(find _project -maxdepth 3 -name settings.gradle.kts | head -n 1)"
            if [ -z "$FOUND" ]; then echo "settings.gradle.kts not found inside $ZIP_FILE"; exit 1; fi
            PROJECT_DIR="$(cd "$(dirname "$FOUND")" && pwd)"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseDialer-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
